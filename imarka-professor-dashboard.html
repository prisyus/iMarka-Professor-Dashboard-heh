<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMARKA | Professor Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bar:#3d5a3e;--green:#2a7340;--mid:#5f9e69;--soft:#82cf8b;--bg:#eef5ec;--circle:#c8d9c4;--yellow:#efd650;--ink:#3d4a3f;--head:#35553a;--line:#e3ebe2;
--sans:'Montserrat','Segoe UI',system-ui,Arial,sans-serif;--nav:'Urbanist','Segoe UI',system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:var(--circle);z-index:-1}
body::before{width:520px;height:520px;top:-60px;right:-170px}
body::after{width:600px;height:600px;bottom:-330px;left:-160px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.topbar{background:var(--bar);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;box-shadow:0 4px 10px rgba(0,0,0,.18);position:sticky;top:0;z-index:20;font-family:var(--nav)}
.logo{color:#fff;font-weight:700;font-size:1.45rem;letter-spacing:-.5px}
.logo i{font-style:normal;color:var(--yellow)}
.topbar nav{display:flex;gap:min(9vw,110px);margin-right:2%}
.topbar nav button{background:none;color:#fff;font-family:var(--nav);font-size:1.15rem;font-weight:500;padding:4px 2px 5px;border-bottom:3px solid transparent}
.topbar nav button.on{border-color:var(--yellow)}

.wrap{max-width:980px;margin:18px auto 50px;padding:0 20px}
.banner{background:var(--green);border-radius:10px;display:flex;align-items:center;gap:22px;padding:0 36px;height:90px;color:#fff;box-shadow:6px 8px 12px rgba(0,0,0,.18);margin-bottom:32px}
.banner .logo{font-size:2.5rem;font-weight:600;font-family:var(--nav)}
.banner .sep{width:4px;height:36px;background:var(--yellow);border-radius:2px}
.banner h1{font-weight:500;font-size:1.4rem;flex:1}
.banner b{font-size:1.05rem}
.yellow{background:var(--yellow);color:#33401f;font-weight:700;border-radius:10px;padding:7px 16px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:26px}
.card{background:var(--bg);border-radius:12px;padding:24px;box-shadow:6px 8px 14px rgba(0,0,0,.16);position:relative}
.card h2{font-size:1.4rem;font-weight:700;color:var(--head)}
.card h2.plain{color:#4a4a4a}
.sub{color:var(--mid);font-size:.95rem;margin:3px 0 12px}
.subjects{margin:10px 0 44px;max-height:96px;overflow:auto}
.subjects div{margin-bottom:4px;color:#4f5a50}
.pill{background:var(--mid);color:#fff;border-radius:9px;padding:9px 17px;font-weight:500;box-shadow:2px 4px 6px rgba(0,0,0,.15);display:inline-flex;align-items:center;gap:8px}
.pill:hover,.pill.on{background:var(--soft)}
.card .corner{position:absolute;right:14px;bottom:14px}
.summary{margin-top:14px;font-size:.92rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.summary a{color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline}

.dd{position:relative;display:inline-block}
.dd.block{display:block}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dd-btn.dark{width:100%;background:var(--green);color:#fff;border-radius:14px;padding:13px 28px;font-size:1.05rem;box-shadow:3px 6px 8px rgba(0,0,0,.2)}
.dd-btn svg{width:20px;height:20px;flex:none}
.dd-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:100%;background:var(--bg);border-radius:12px;padding:6px;box-shadow:3px 6px 14px rgba(0,0,0,.22);z-index:10;white-space:nowrap}
.dd-menu.green{background:var(--soft)}
.dd.open .dd-menu{display:block}
.dd-menu button{display:block;width:100%;text-align:left;background:none;padding:7px 12px;border-radius:9px;color:#5b6b5d}
.dd-menu.green button{color:#fff}
.dd-menu button:hover{background:rgba(255,255,255,.55);box-shadow:2px 3px 5px rgba(0,0,0,.12)}

.grade-card{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:26px 30px 36px}
.btns{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
table{border-collapse:collapse;background:#fff;width:100%}
th{background:var(--mid);text-align:left;padding:10px;font-weight:500;color:#1b1b1b;border:1px solid var(--mid)}
td{padding:10px;border:1px solid var(--line);font-size:.9rem;color:#1b1b1b}
.wt{max-width:330px;margin-left:auto}
.wt td:last-child,.wt th:last-child{text-align:center;width:130px}
.wt tr.hl td{background:#e1f2e3}
.wt input{width:100%;border:0;border-bottom:1.5px solid #222;background:transparent;font-style:italic;text-align:inherit;padding:0 2px}
.wt input.num{text-align:center;width:60px}
.wt tfoot td{font-weight:700;background:var(--bg)}
.wt .bad{color:#b3392c}

.page{display:none}.page.on{display:block}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}
select.sel,input.fld{background:#fff;border:1.5px solid var(--circle);border-radius:10px;padding:9px 12px;min-width:220px}
.seg{display:flex;gap:10px}
.tbl{overflow-x:auto;border-radius:8px}
.tbl table{min-width:560px}
.tbl td input{width:68px;text-align:center;border:1px solid var(--circle);border-radius:6px;padding:5px}
.tbl th.hl,.tbl td.hl{background:#e1f2e3}
.tbl th.hl{background:var(--soft);color:#fff}
.tag{padding:3px 12px;border-radius:20px;font-size:.8rem;font-weight:600;background:#dcefdd;color:var(--green)}
.tag.low{background:#f6e0dc;color:#b3392c}
.empty{text-align:center;padding:26px;color:var(--mid)}

.overlay{position:fixed;inset:0;background:rgba(30,50,34,.55);display:none;place-items:center;z-index:50;padding:20px}
.overlay.on{display:grid}
.modal{background:var(--bg);border-radius:14px;padding:26px;width:min(440px,100%);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.modal h2{color:var(--head);margin-bottom:14px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--circle)}
.mrow button{background:none;color:#b3392c;font-weight:600}
.add{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:14px 0}
.add input{min-width:0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
#login .modal{text-align:center}
#login .logo{color:var(--green);font-size:2.4rem}#login .logo i{color:#d4b72f}
#login input{width:100%;margin:8px 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--bar);color:#fff;padding:12px 22px;border-radius:10px;border-bottom:4px solid var(--yellow);opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:800px){
 .row2,.grade-card{grid-template-columns:1fr}.wt{max-width:none}
 .topbar nav{gap:16px;margin:0}.topbar nav button{font-size:1rem}
 .banner{padding:0 18px;gap:12px;height:auto;min-height:80px;flex-wrap:wrap;padding-block:12px}
 .banner .logo{font-size:1.9rem}.banner h1{font-size:1.05rem;flex-basis:100%;order:5}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><i>i</i>MARKA</div>
  <nav id="nav">
    <button class="on" data-page="home">Home</button>
    <button data-page="students">Students</button>
    <button data-page="grades">Grade Management</button>
  </nav>
</div>

<div class="wrap">
  <div class="banner">
    <div class="logo"><i>i</i>MARKA</div><div class="sep"></div>
    <h1>Professor Dashboard</h1>
    <b id="profId">PO02</b>
    <button class="yellow" id="logout">Logout</button>
  </div>

  <!-- HOME -->
  <section class="page on" id="home">
    <div class="row2">
      <div class="card">
        <h2 class="plain">Assigned Subjects</h2>
        <div class="subjects" id="subjList"></div>
        <button class="pill corner" id="manageSubj">Manage Subject</button>
      </div>
      <div class="card">
        <h2>Students</h2>
        <div class="sub">Subject</div>
        <div class="dd block" id="ddSubject">
          <button class="dd-btn dark" aria-haspopup="listbox"><span>– Select Subject –</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 8l9 9 9-9"/></svg></button>
          <div class="dd-menu"></div>
        </div>
        <div class="summary" id="summary" hidden></div>
      </div>
    </div>

    <div class="card grade-card">
      <div>
        <h2>Grade Management</h2>
        <div class="sub">Configure grading periods, categories, and scores</div>
        <div class="btns">
          <div class="dd" id="ddSem1"><button class="pill dd-btn on">1st Sem <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 8l9 9 9-9"/></svg></button><div class="dd-menu green"></div></div>
          <div class="dd" id="ddSem2"><button class="pill dd-btn">2nd Sem <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 8l9 9 9-9"/></svg></button><div class="dd-menu green"></div></div>
          <div class="dd" id="ddManage"><button class="pill dd-btn">Manage</button><div class="dd-menu green"></div></div>
        </div>
      </div>
      <div class="wt"><table><thead><tr><th>Category</th><th>Weight %</th></tr></thead><tbody id="wBody"></tbody><tfoot><tr><td>Total</td><td id="wTotal"></td></tr></tfoot></table></div>
    </div>
  </section>

  <!-- STUDENTS -->
  <section class="page" id="students">
    <div class="card">
      <h2>Students</h2>
      <div class="toolbar"><select class="sel" id="stSel"></select><input class="fld" id="stSearch" type="search" placeholder="Search by name or ID"></div>
      <div class="tbl"><table><thead><tr><th>Student</th><th>ID</th><th>1st Sem</th><th>2nd Sem</th><th>Standing</th></tr></thead><tbody id="stBody"></tbody></table></div>
    </div>
  </section>

  <!-- GRADES -->
  <section class="page" id="grades">
    <div class="card">
      <h2>Grade Management</h2>
      <div class="toolbar">
        <select class="sel" id="grSel"></select>
        <div class="seg"><button class="pill on" data-sem="1">1st Sem</button><button class="pill" data-sem="2">2nd Sem</button></div>
        <button class="pill" id="saveScores" style="background:var(--green)">Save scores</button>
      </div>
      <div class="tbl"><table><thead id="grHead"></thead><tbody id="grBody"></tbody></table></div>
    </div>
  </section>
</div>

<!-- Manage subjects modal -->
<div class="overlay" id="subjModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Manage subjects">
  <h2>Manage subjects</h2><div id="mList"></div>
  <div class="add"><input class="fld" id="nCode" placeholder="Code"><input class="fld" id="nName" placeholder="Subject name"></div>
  <div class="actions"><button class="pill" id="addSubj" style="background:var(--green)">Add subject</button><button class="pill" id="closeModal">Done</button></div>
</div></div>

<!-- Login -->
<div class="overlay" id="login"><div class="modal">
  <div class="logo"><i>i</i>MARKA</div><p class="sub">Professor sign in</p>
  <input class="fld" id="lid" value="PO02" aria-label="Professor ID">
  <input class="fld" id="lpw" type="password" placeholder="Password (any)" aria-label="Password">
  <div class="actions" style="justify-content:center"><button class="yellow" id="signin">Sign in</button></div>
</div></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='imarka-prof-v1';
const FN=['Angela','Benjamin','Carla','Daniel','Elise','Francis','Gwen','Hugo'],LN=['Cruz','Santos','Mendoza','Lim','Navarro','Torres','Villanueva','Ramos'];
const roster=n=>FN.map((f,i)=>({id:`2024-${String(n*100+i+1).padStart(4,'0')}`,name:`${LN[(i+n)%8]}, ${f}`}));
const defW=()=>[{n:'Attendance',w:5},{n:'Activities',w:25},{n:'Performance Task',w:30},{n:'Midterm',w:40}];
const fresh=()=>({subjects:[{code:'GE008',name:'Ethics',st:roster(1)},{code:'CS203',name:'Discrete Structures',st:roster(2)},{code:'IT204',name:'Information Management',st:roster(3)}],
  weights:{1:defW(),2:defW()},scores:{},subj:null,sem:1,cat:null,loggedIn:true});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300)};
const seed=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h};
const getScore=(sem,id,i)=>{const k=`${S.subj}|${sem}|${id}|${i}`;return k in S.scores?S.scores[k]:70+seed(k)%29};
const finalGrade=(sem,id)=>Math.round(S.weights[sem].reduce((a,c,i)=>a+getScore(sem,id,i)*c.w/100,0));
const curSubj=()=>S.subjects.find(s=>s.code===S.subj);

/* ----- dropdown helper ----- */
function closeDD(){$$('.dd.open').forEach(d=>d.classList.remove('open'))}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeDD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDD();$('#subjModal').classList.remove('on')}});
function setupDD(id,items,pick){
  const dd=$(id),menu=dd.querySelector('.dd-menu');
  menu.innerHTML=items.length?items.map((it,i)=>`<button data-i="${i}">${esc(it.label)}</button>`).join(''):'<button disabled>No items</button>';
  dd.querySelector('.dd-btn').onclick=e=>{e.stopPropagation();const was=dd.classList.contains('open');closeDD();if(!was)dd.classList.add('open')};
  menu.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;closeDD();pick(items[b.dataset.i],+b.dataset.i)};
}

/* ----- navigation ----- */
function go(p){$$('.page').forEach(x=>x.classList.toggle('on',x.id===p));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
  if(p==='students')renderStudents();if(p==='grades')renderGrades()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.page)};

/* ----- subjects ----- */
function renderSubjects(){
  $('#subjList').innerHTML=S.subjects.length?S.subjects.map(s=>`<div><b>${esc(s.code)}</b><br>${esc(s.name)}</div>`).join(''):'<div>No subjects assigned.</div>';
  const opts=S.subjects.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} · ${esc(s.name)}</option>`).join('');
  ['#stSel','#grSel'].forEach(id=>{$(id).innerHTML='<option value="">– Select Subject –</option>'+opts;$(id).value=S.subj||''});
  setupDD('#ddSubject',S.subjects.map(s=>({label:s.name,code:s.code})),it=>{S.subj=it.code;save();syncSubject()});
  syncSubject();
}
function syncSubject(){
  const s=curSubj();if(!s)S.subj=null;
  $('#ddSubject .dd-btn span').textContent=s?s.name:'– Select Subject –';
  ['#stSel','#grSel'].forEach(id=>$(id).value=S.subj||'');
  const sm=$('#summary');sm.hidden=!s;
  if(s)sm.innerHTML=`<span>${s.st.length} students enrolled</span><a id="viewSt">View students</a>`;
  const v=$('#viewSt');if(v)v.onclick=()=>go('students');
  renderStudents();renderGrades();
}
$('#stSel').onchange=$('#grSel').onchange=e=>{S.subj=e.target.value||null;save();syncSubject()};

/* ----- weights table (home) ----- */
let editing=false;
function renderWeights(){
  const w=S.weights[S.sem];
  $('#wBody').innerHTML=w.map((c,i)=>editing
    ?`<tr><td><input data-i="${i}" data-f="n" value="${esc(c.n)}" aria-label="Category name"></td><td><input class="num" type="number" min="0" max="100" data-i="${i}" data-f="w" value="${c.w}" aria-label="Weight"></td></tr>`
    :`<tr class="${S.cat===i?'hl':''}"><td>${esc(c.n)}</td><td>${c.w}%</td></tr>`).join('');
  const t=w.reduce((a,c)=>a+(+c.w||0),0);
  $('#wTotal').innerHTML=`<span class="${t!==100?'bad':''}">${t}%</span>`;
  $('#ddSem1 .pill').classList.toggle('on',S.sem===1);$('#ddSem2 .pill').classList.toggle('on',S.sem===2);
}
$('#wBody').addEventListener('input',e=>{const el=e.target,c=S.weights[S.sem][el.dataset.i];
  c[el.dataset.f]=el.dataset.f==='w'?Math.max(0,Math.min(100,+el.value||0)):el.value;
  const t=S.weights[S.sem].reduce((a,c)=>a+(+c.w||0),0);$('#wTotal').innerHTML=`<span class="${t!==100?'bad':''}">${t}%</span>`});
[1,2].forEach(n=>setupDD('#ddSem'+n,[],()=>{}));
function setupSems(){
  [1,2].forEach(n=>setupDD('#ddSem'+n,S.weights[n].map(c=>({label:c.n})),(it,i)=>{
    S.sem=n;S.cat=i;editing=false;save();renderWeights();toast(`${n===1?'1st':'2nd'} Sem · ${it.label}`)}));
}
setupDD('#ddManage',[{label:'Edit'},{label:'Update'}],it=>{
  if(it.label==='Edit'){editing=true;renderWeights();toast('Editing categories and weights')}
  else{
    if(!editing)return toast('Choose Edit first to make changes');
    const w=S.weights[S.sem],t=w.reduce((a,c)=>a+(+c.w||0),0);
    if(w.some(c=>!c.n.trim()))return toast('Every category needs a name');
    if(t!==100)return toast(`Weights total ${t}%. They must add up to 100%`);
    editing=false;save();setupSems();renderWeights();renderGrades();toast('Grading weights updated');
  }});

/* ----- students page ----- */
function renderStudents(){
  const s=curSubj(),b=$('#stBody'),q=$('#stSearch').value.trim().toLowerCase();
  if(!s)return b.innerHTML='<tr><td colspan="5" class="empty">Select a subject to see its students.</td></tr>';
  const l=s.st.filter(x=>(x.name+x.id).toLowerCase().includes(q));
  b.innerHTML=l.length?l.map(x=>{const a=finalGrade(1,x.id),c=finalGrade(2,x.id),avg=(a+c)/2;
    return `<tr><td><b>${esc(x.name)}</b></td><td>${x.id}</td><td>${a}</td><td>${c}</td><td><span class="tag ${avg<75?'low':''}">${avg<75?'Needs attention':'Passing'}</span></td></tr>`}).join('')
    :'<tr><td colspan="5" class="empty">No students match your search.</td></tr>';
}
$('#stSearch').oninput=renderStudents;

/* ----- grades page ----- */
function renderGrades(){
  const s=curSubj(),w=S.weights[S.sem];
  $$('.seg button').forEach(b=>b.classList.toggle('on',+b.dataset.sem===S.sem));
  $('#grHead').innerHTML=`<tr><th>Student</th>${w.map((c,i)=>`<th class="${S.cat===i?'hl':''}">${esc(c.n)} (${c.w}%)</th>`).join('')}<th>Final</th></tr>`;
  $('#grBody').innerHTML=!s?`<tr><td colspan="${w.length+2}" class="empty">Select a subject to enter scores.</td></tr>`
    :s.st.map(x=>`<tr><td><b>${esc(x.name)}</b></td>${w.map((c,i)=>`<td class="${S.cat===i?'hl':''}"><input type="number" min="0" max="100" value="${getScore(S.sem,x.id,i)}" data-id="${x.id}" data-i="${i}" aria-label="${esc(c.n)} score for ${esc(x.name)}"></td>`).join('')}<td><span class="tag ${finalGrade(S.sem,x.id)<75?'low':''}">${finalGrade(S.sem,x.id)}</span></td></tr>`).join('');
}
$('#grBody').addEventListener('change',e=>{const el=e.target;if(!el.dataset.id)return;
  el.value=Math.max(0,Math.min(100,+el.value||0));S.scores[`${S.subj}|${S.sem}|${el.dataset.id}|${el.dataset.i}`]=+el.value;save();renderGrades()});
$('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sem=+b.dataset.sem;S.cat=null;editing=false;save();renderWeights();renderGrades()};
$('#saveScores').onclick=()=>{save();toast('Scores saved')};

/* ----- manage subjects modal ----- */
function renderModal(){
  $('#mList').innerHTML=S.subjects.map((s,i)=>`<div class="mrow"><span><b>${esc(s.code)}</b> · ${esc(s.name)}</span><button data-i="${i}">Remove</button></div>`).join('')||'<p class="empty">No subjects yet.</p>';
}
$('#manageSubj').onclick=()=>{renderModal();$('#subjModal').classList.add('on')};
$('#closeModal').onclick=()=>$('#subjModal').classList.remove('on');
$('#mList').onclick=e=>{const b=e.target.closest('button');if(!b)return;const [r]=S.subjects.splice(+b.dataset.i,1);
  if(S.subj===r.code)S.subj=null;save();renderModal();renderSubjects();toast(r.name+' removed')};
$('#addSubj').onclick=()=>{
  const code=$('#nCode').value.trim().toUpperCase(),name=$('#nName').value.trim();
  if(!code||!name)return toast('Enter a subject code and name');
  if(S.subjects.some(s=>s.code===code))return toast('That subject code already exists');
  S.subjects.push({code,name,st:roster(S.subjects.length+4)});
  $('#nCode').value=$('#nName').value='';save();renderModal();renderSubjects();toast(name+' added');
};

/* ----- login / logout ----- */
function gate(){$('#login').classList.toggle('on',!S.loggedIn)}
$('#logout').onclick=()=>{S.loggedIn=false;save();gate();go('home')};
$('#signin').onclick=()=>{
  const id=$('#lid').value.trim().toUpperCase();if(!id)return toast('Enter your professor ID');
  S.loggedIn=true;$('#profId').textContent=id;save();gate();toast('Welcome back, '+id);
};

/* ----- init ----- */
renderSubjects();setupSems();renderWeights();gate();
</script>
</body>
